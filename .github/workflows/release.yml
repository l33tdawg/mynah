name: Release

# Tag-driven, so the artifact and the tag cannot disagree about what shipped.
# The manual trigger exists for dry runs: it builds and verifies but publishes
# nothing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      label:
        description: "Optional prerelease label (e.g. rc.1). Empty for stable."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      SAGE_VOICE_CODESIGN_IDENTITY: "Developer ID Application: Dhillon Kannabhiran (2N7GKZ8D8Z)"
      MYNAH_RELEASE_LABEL: ${{ github.event.inputs.label }}

    steps:
      - uses: actions/checkout@v4

      # **The newest Xcode on the runner, not the default one.**
      #
      # Every tagged run failed to compile, and the last one died at
      # `error: fatalError` — SwiftPM's way of saying the compiler process
      # itself gave out — on a file that builds fine here. The gap is the
      # toolchain: this is developed on Swift 6.3 and the image defaults to
      # Xcode 16.4, roughly two major versions behind.
      #
      # A CI that compiles with a compiler nobody ships against does not check
      # the thing it looks like it is checking. It reports red for language
      # features the product legitimately uses, and it would keep doing so
      # after every fix.
      #
      # Listed before selecting so a future failure says which versions were
      # actually available rather than leaving somebody to guess.
      - name: Use the newest Xcode on this runner
        run: |
          set -euo pipefail
          ls /Applications | grep -i '^Xcode' || true
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "selecting $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          swift --version

      # Decided once, up front, so every later step agrees about whether this is
      # a real release. A half-signed artifact is worse than an unsigned one:
      # it looks publishable.
      - name: Check for signing secrets
        id: secrets
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [[ -n "$CERT" && -n "$APPLE_ID" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets — building an ad-hoc artifact that will NOT be published."
          fi

      - name: Import Developer ID certificate
        if: steps.secrets.outputs.signed == 'true'
        env:
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          CERT="$RUNNER_TEMP/developer-id.p12"
          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # Without this, codesign blocks on a GUI prompt no runner can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT"

      # **Before the tests, because a tool that is not staged does not fail a
      # test — it skips it.**
      #
      # `DocumentExporter.locate()` searches `../Resources/<tool>` inside
      # Mynah.app and `vendor/<tool>` in a checkout, and `vendor/` is gitignored.
      # A runner checks out the repository and therefore has neither, so until
      # now every document test on this workflow threw `XCTSkip` and the bare
      # `swift test` below reported success: no document test has ever run on a
      # public runner. Measured locally, staging these three turns twelve skips
      # back into twelve assertions.
      #
      # Only these three. provision-onnxruntime.sh and provision-espeak-ng.sh
      # are what the *bundle* needs, and the tests they would add read a Kokoro
      # model out of a directory no hosted runner has, so they would arrive as
      # more skips rather than more coverage — and espeak-ng compiles from
      # source, which is the slowest step in the release. provision-asr-assets.sh
      # downloads 626 MB and unlocks no test at all. The counts below are set
      # for exactly this list.
      - name: Stage the document writers before testing them
        run: |
          set -euo pipefail
          bash scripts/provision-pandoc.sh
          bash scripts/provision-typst.sh
          bash scripts/provision-typst-packages.sh

      # **Debug, and only the Swift package.** This is what a visitor to a
      # public repository actually wants to know: does it build, do the tests
      # pass — and now, did they actually run.
      #
      # It replaces a full `scripts/release.sh` run, which was failing here and
      # nowhere else. `error: fatalError` with no diagnostic, part way through
      # the largest SwiftUI module, under whole-module optimisation, is the
      # compiler frontend being killed — a hosted runner has a fraction of the
      # memory this machine does, and a release build of MynahMac exceeds it.
      # Verified by reproducing every other difference locally and finding none
      # of them guilty: cold cache, no vendored onnxruntime, release
      # configuration, and the identical toolchain all build in 61 seconds here.
      #
      # It also could not have published: signing and notarisation need secrets
      # this repository does not hold, so the release path was doing expensive
      # work whose only possible outcome was an artifact nobody may install.
      #
      # The assertion is scripts/assert-test-run.sh, the same file
      # scripts/release.sh uses, so this runner and the build Mac cannot come to
      # different conclusions about what counts as a verified suite. It replaces
      # nothing here, because there was nothing here: this step used to be a
      # bare `swift test`, without even the executed-count check the release
      # script had.
      #
      # The two numbers are runner numbers rather than the script's defaults,
      # and each is derived rather than guessed.
      #
      # 1777 executed instead of 1815, because without vendor/onnxruntime
      # Package.swift leaves the KokoroEngine targets out of the graph
      # altogether — measured locally at exactly 1777 with those three targets
      # absent, so the floor sits 17 under it.
      #
      # 27 skipped instead of 21, because ten further tests reach for
      # voices-v1.0.bin and a runner has it in neither of the two places they
      # look: `~/Library/Application Support/SAGE Voice Bridge/Kokoro`, which
      # nothing here stages, and the owner's own ~/sage-voice-lab. Those ten are
      # the nine tests in KokoroVoicesTests that go through `archive()` and the
      # one in CallSettingsTests that reads the file directly, counted in the
      # source rather than estimated. The ceiling is 28 — one of slack, and
      # still eleven clear of the 39 an unstaged document surface would produce.
      #
      # If the first real run here disagrees, it prints the true figures and
      # says so; correct these to them rather than widening them.
      - name: Build and test
        env:
          # **The runner's graph is not the build Mac's, so this is not the
          # script's number.** vendor/onnxruntime is deliberately not staged
          # below, so Package.swift drops KokoroEngineTests and its 38 tests
          # before the run starts: 2336 on the build Mac means 2298 here.
          #
          # Twelve under the runner's own count, which is what assert-test-run.sh's
          # rot check wants — it fires at floor + 38, so a floor set further under
          # buys less room than it appears to. This was "1830" and stayed there
          # when the script's own floor was raised, which turned every CI run red
          # on a perfectly healthy suite: the check is new, and the first thing
          # it caught was the commit that added it.
          #
          # Raise both in one commit. They are one subtraction apart and setting
          # only one is how this first went red.
          MYNAH_MIN_EXECUTED_TESTS: "2406"
          MYNAH_MAX_SKIPPED_TESTS: "28"
        run: |
          set -euo pipefail
          swift build
          TEST_LOG="$RUNNER_TEMP/tests.log"
          # `arch -arm64` for the same reason release.sh uses it: where the
          # xctest runner resolves to x86_64 the arm64 bundle fails to load, the
          # run reports zero tests, and the command still exits 0.
          if /usr/bin/arch -arm64 /usr/bin/true 2>/dev/null; then
            arch -arm64 swift test 2>&1 | tee "$TEST_LOG"
          else
            swift test 2>&1 | tee "$TEST_LOG"
          fi
          bash scripts/assert-test-run.sh "$TEST_LOG"

      - name: Build, sign, notarize
        # Only where it can finish. Without signing secrets this produced an
        # ad-hoc artifact that the next step then refused to publish.
        if: steps.secrets.outputs.signed == 'true'
        env:
          MYNAH_NOTARIZE: "true"
          MYNAH_APPLE_ID: ${{ secrets.APPLE_ID }}
          MYNAH_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MYNAH_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # **This step runs the suite a second time, and without these it
          # judges a hosted runner by the build Mac's numbers.**
          # scripts/release.sh calls the same scripts/assert-test-run.sh, so the
          # signed release path would die at its own gate after every
          # provisioning step and the signing had been paid for — and with a
          # message about a missing document surface, which is not what
          # happened.
          #
          # The floor is the build Mac's, and that is derived rather than
          # copied: release.sh provisions vendor/onnxruntime before the first
          # SwiftPM command, so unlike the step above this run has the
          # KokoroEngine targets in its graph and the same total to clear.
          #
          # **The ceiling is deliberately loose, because the honest number is
          # unmeasured.** This path has never completed on a runner — it is
          # gated on signing secrets — so how many Kokoro tests skip without the
          # model in ~/sage-voice-lab is not something anybody here has counted.
          # A tight number invented now would be a guess that fails a release,
          # and a guess is what this whole gate exists to replace.
          #
          # Loosening it costs nothing that matters: the "Build and test" step
          # above runs first, in this same job, on this same commit, with the
          # runner's own measured numbers. A hollow suite is already caught
          # there. This is the second lock on the same door.
          #
          # Replace it with the real figure the first time this path completes:
          # assert-test-run.sh prints "N of M really ran, S skipped" on success.
          # release.sh provisions onnxruntime, so this path DOES have
          # KokoroEngineTests and wants the build Mac's number, not the one on
          # the step above. Kept correct even though this step is gated on
          # signing secrets this repository does not hold, because a value that
          # is only wrong when it finally runs is the worst kind.
          MYNAH_MIN_EXECUTED_TESTS: "2444"
          MYNAH_MAX_SKIPPED_TESTS: "45"
        run: bash scripts/release.sh

      - name: Publish
        # Tags only, and only when the artifact is genuinely signed and stapled.
        # A workflow_dispatch dry run reaches here and stops, which is the point.
        if: startsWith(github.ref, 'refs/tags/v') && steps.secrets.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG="$(ls dist/Mynah-*.dmg | head -1)"
          ZIP="$(ls dist/Mynah-*.zip | head -1)"
          PRERELEASE=""
          # A tag carrying a hyphen is a prerelease by semver convention —
          # v1.2.0-rc.1 must not land on the release page as the current build.
          [[ "${GITHUB_REF_NAME}" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$GITHUB_REF_NAME" \
            "$DMG" "$DMG.sha256" "$ZIP" "$ZIP.sha256" \
            --title "Mynah $GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE

      - name: Keep the artifact even when publishing is skipped
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mynah-release
          path: |
            dist/Mynah-*.dmg
            dist/Mynah-*.dmg.sha256
            dist/Mynah-*.zip
            dist/Mynah-*.zip.sha256
          if-no-files-found: warn
