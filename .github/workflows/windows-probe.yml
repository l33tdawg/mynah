name: Windows probe

# **This job is EXPECTED TO FAIL, and that is the point.**
#
# Not one line of this project has ever been compiled for Windows. The only
# Windows artefacts that exist anywhere were produced on a Mac by forcing a
# manifest dump, which proves nothing: `Package.swift` is Swift compiled for the
# *host*, so a dump on a Mac tells you what the Mac thinks the package is.
#
# There is no way to compile this locally. As of August 2026 there is no Swift
# SDK that cross-compiles to Windows — `swift-sdk-generator` supports Linux and
# FreeBSD as targets and macOS as a host only, so `swift sdk install` has
# nothing to offer here. Docker Desktop on macOS runs a Linux VM, so a Windows
# container is not a thing that can exist on the build Mac. That leaves a real
# Windows machine, and this runner is the only one on the project.
#
# So the deliverable of this workflow is not a green tick. It is an ERROR LIST:
# the first honest inventory of what Windows actually objects to. Read the job
# summary, not the status badge.
#
# It is `continue-on-error` at the job level and is deliberately NOT a required
# check, so it can be as red as it likes without blocking macOS 2.3.x releases
# or the Linux 2.4 work. Nothing else in CI depends on it.

on:
  push:
    branches:
      - port/linux-windows
  pull_request:
    branches:
      - port/linux-windows
  workflow_dispatch:

# Read-only. This job compiles and reports; it publishes nothing.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight probe worthless, and this
# job is slow (a Swift toolchain install is several minutes).
concurrency:
  group: windows-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile SageVoiceCore on Windows
    runs-on: windows-latest

    # **The whole point of the file.** A failure here is data, not a broken
    # build. Without this the run goes red and starts training people to ignore
    # a red tick on this repository, which is the one habit that would make the
    # macOS release pipeline dangerous.
    continue-on-error: true

    steps:
      # **Before checkout, not after.**
      #
      # `actions/checkout` shells out to git, so the config has to already be in
      # place when it runs. NTFS protection rejects paths git is happy with on a
      # Mac, and the 260-character MAX_PATH ceiling bites in a
      # `.build\x86_64-unknown-windows-msvc\debug\...` tree long before it bites
      # in the source tree. Neither is a problem this repository has today — the
      # longest tracked path is 77 characters and nothing has a colon in it —
      # but the failure mode is a checkout error that looks nothing like a
      # compiler error, and diagnosing that from a red tick costs an hour.
      - name: Let git write these paths
        run: |
          git config --global core.protectNTFS false
          git config --global core.longpaths true

      - uses: actions/checkout@v4

      # **6.3.3, matching the Mac exactly.**
      #
      # `swift-actions/setup-swift` advertises Windows but its own README
      # describes itself as working on Ubuntu and macOS runners, and a toolchain
      # that half-installs would make this probe report Swift's problems instead
      # of the port's. `compnerd/gha-setup-swift` is written by the Swift on
      # Windows platform maintainer and does the MSVC wiring too, so no separate
      # vsdevenv step is needed.
      #
      # Pinning the version matters more here than usual: the errors this job
      # exists to collect must be errors about THIS CODE, and a toolchain that
      # drifts a version ahead of the Mac would mix language-level complaints
      # into the list.
      - name: Install the Swift toolchain
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - name: Say which compiler this is
        run: swift --version

      # **Does the manifest even LOAD?**
      #
      # A distinct failure mode from a source error, and worth isolating,
      # because `Package.swift` branches on the HOST: `#if os(macOS)` there means
      # "this package is being read on a Mac", not "this product will run on a
      # Mac". On this runner the host IS Windows, so the manifest should take
      # its non-Darwin path — declare swift-crypto, exclude `Sources/SageVoiceCore/Call`,
      # and leave the AppKit targets undeclared. That is exactly why the build
      # has to happen here and not via cross-compilation: a cross-compile from
      # the Mac would load this manifest as the MAC one and assemble the wrong
      # package graph before a single source file was read.
      #
      # `dump-package` failing means the port's problem is in the manifest.
      # `dump-package` succeeding and the next step failing means it is in the
      # sources. Two different people fix those.
      - name: Load the manifest
        id: manifest
        continue-on-error: true
        run: |
          swift package dump-package > package-graph.json
          Write-Host "Manifest loaded. Targets Windows believes exist:"
          (Get-Content package-graph.json | ConvertFrom-Json).targets | ForEach-Object { $_.name }

      # `vendor/` is gitignored, so `hasOnnxRuntime` is false here and the
      # Kokoro targets are absent. That is intended: the native voice runtime is
      # a separate provisioning problem and dragging it in would bury the
      # signal.
      - name: Resolve dependencies
        continue-on-error: true
        run: swift package resolve

      # **The gate: the library, on its own.**
      #
      # `--target SageVoiceCore` rather than a full `swift build`, because the
      # library is the thing that has to compile before anything else is worth
      # discussing. Building everything would stop at the first failing target
      # and hide whether the daemon has problems of its own.
      #
      # `continue-on-error` on the step as well as the job so the summary step
      # below still runs and still collects.
      - name: Compile SageVoiceCore
        id: core
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          swift build --target SageVoiceCore 2>&1 | Tee-Object -FilePath core-build.log
          exit $LASTEXITCODE

      # Runs even when the library fails, and will mostly repeat its errors —
      # but where it does not, the extra lines are the daemon's own (`main.swift`
      # signal handling, the launchd-shaped assumptions).
      - name: Compile sage-voiced
        id: daemon
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          swift build --product sage-voiced 2>&1 | Tee-Object -FilePath daemon-build.log
          exit $LASTEXITCODE

      # XCTest on Windows is its own adventure and is not what this round is
      # about. Kept last and kept optional so a test-harness problem can never be
      # mistaken for a core compile problem.
      - name: Compile the test target
        id: tests
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          swift build --build-tests 2>&1 | Tee-Object -FilePath tests-build.log
          exit $LASTEXITCODE

      # **The actual deliverable.**
      #
      # A status tick tells you it failed. This tells you WHAT failed, grouped
      # and counted, on the run's own summary page — so the port can be planned
      # from the error list rather than from an audit's guesses.
      - name: Write the error list to the job summary
        if: always()
        # The uploaded logs are the real fallback, so a formatting slip in
        # the summary must never cost us the artefact step below.
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'

          function Emit($title, $logPath, $outcome) {
            "## $title" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "Result: **$outcome**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            if (-not (Test-Path $logPath)) {
              "_No log — the step did not get far enough to produce one._" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              return
            }
            $errors = @(Select-String -Path $logPath -Pattern 'error:' -SimpleMatch |
                      ForEach-Object { $_.Line.Trim() } | Select-Object -Unique)
            "Distinct error lines: **$($errors.Count)**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

            # Which files object, most-broken first. This is the list to plan from.
            "### Files, by error count" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $errors | ForEach-Object {
              if ($_ -match '([^\\/:]+\.swift):\d+:\d+: error:') { $matches[1] }
            } | Group-Object | Sort-Object Count -Descending |
                ForEach-Object { "{0,4}  {1}" -f $_.Count, $_.Name } |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

            "<details><summary>Every distinct error line</summary>" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $errors | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "</details>" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

          "# Windows compile probe" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "A red run here is the expected result and blocks nothing. The list below is the deliverable." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          Emit "SageVoiceCore (the gate)" "core-build.log" "${{ steps.core.outcome }}"
          Emit "sage-voiced"              "daemon-build.log" "${{ steps.daemon.outcome }}"
          Emit "Test target"              "tests-build.log"  "${{ steps.tests.outcome }}"

      # The summary truncates at 1 MB and a first run may well blow past that.
      # The raw logs are the fallback.
      - name: Keep the raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            core-build.log
            daemon-build.log
            tests-build.log
            package-graph.json
          if-no-files-found: warn
          retention-days: 30
